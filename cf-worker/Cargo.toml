[package]
name = "city-cycling-worker"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Cloudflare Worker: Santander Cycles web server + D1-backed collector cron"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = { version = "0.8", features = ["d1"] }

# JSON parsing for the TFL BikePoint API.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time handling. "wasmbind" lets Utc::now() work under wasm32 (reads the JS
# Date API instead of a syscall); chrono-tz gives correct Europe/London local
# time (with DST) for the collector's overnight skip window.
chrono = { version = "0.4", features = ["wasmbind"] }
chrono-tz = "0.10"

console_error_panic_hook = "0.1"

[profile.release]
# No `strip`: it drops the `target_features` custom section wasm-bindgen
# needs to detect enabled Wasm features. worker-build already runs
# wasm-opt afterward for size, so stripping here is both redundant and
# counterproductive.
lto = true
codegen-units = 1
opt-level = "s"
