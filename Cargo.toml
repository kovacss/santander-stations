[package]
name = "city-cycling"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Tracks Santander Cycle stations in London and serves an interactive map"

[[bin]]
name = "collector"
path = "src/bin/collector.rs"

[[bin]]
name = "collector-r2"
path = "src/bin/collector_r2.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "collector-sqlite"
path = "src/bin/collector_sqlite.rs"

[dependencies]
# Async runtime + web server
tokio = { version = "1", features = ["full"] }
axum = "0.8"

# HTTP client + XML parsing for the TFL feed
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "http2"] }
quick-xml = { version = "0.37", features = ["serialize"] }

# Cloudflare R2 (S3-compatible)
aws-sdk-s3 = { version = "1", features = ["behavior-version-latest"] }

# Local SQLite storage (POC for a future Cloudflare D1 backend). "bundled"
# compiles SQLite in rather than requiring it on the system.
rusqlite = { version = "0.32", features = ["bundled"] }

# Serialization, time, config, CLI, logging, errors
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
dotenvy = "0.15"
clap = { version = "4", features = ["derive"] }
humantime = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"

[profile.release]
lto = "thin"
strip = true
